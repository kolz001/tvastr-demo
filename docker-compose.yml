# Local infrastructure for tvastr development.
# OpenSearch stores logs + the audit trail; Dashboards gives you a UI.
# Ollama runs natively on the host (brew install ollama) — point TVASTR_OLLAMA_BASE_URL
# at http://localhost:11434. Set TVASTR_USE_MOCKS=false to exercise these for real.

services:
  tvastr:
    build: .
    ports:
      - "8001:8000"   # host 8000 is taken by another local app
    env_file:
      - path: .env
        required: false
    environment:
      TVASTR_SANDBOX_WORK_ROOT: /app/data/sandbox
      # ${PWD} is the invoking shell's dir — run `docker compose up` from the repo root.
      TVASTR_SANDBOX_HOST_WORK_ROOT: ${PWD}/data/sandbox
      # Host dev uvicorn is the sole sweeper on this machine — a second
      # process sweeping the same ./data/runs would mark its live runs
      # interrupted (per-process in-flight registry). Pure-container
      # deployments should flip this to "true".
      TVASTR_SWEEP_ON_STARTUP: "false"
      # Same single-scheduler rationale: host dev uvicorn is the sole
      # self-heal scheduler on this shared-data machine.
      TVASTR_SELF_HEAL_ENABLED: "false"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: tvastr-opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: tvastr-dashboards
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
