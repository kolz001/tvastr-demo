[project]
name = "tvastr"
version = "0.1.0"
description = "Autonomous Code Remediation Agent — monitors logs for recurring failures, traces root causes in a GitHub repo, and opens fix PRs. Hybrid local/cloud LLM routing."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Nikhil Koli" }]
keywords = ["agent", "langgraph", "llm", "claude", "ollama", "remediation", "observability"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "anthropic>=0.40",
    "ollama>=0.4",
    "opensearch-py>=2.7",
    "PyGithub>=2.5",
    "pip>=26.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
# Local NER layer for PII detection (regex floor + Presidio/spaCy). Optional:
# without it, redaction falls back to the regex-only floor. After installing,
# fetch a spaCy model: `python -m spacy download en_core_web_lg`.
pii = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]

[project.scripts]
tvastr = "tvastr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tvastr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI uses function calls (Depends/Query) in argument defaults

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    'ignore:Field name "register".*shadows an attribute in parent "BaseModel":UserWarning',
]
